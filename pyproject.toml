[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supplier-assurance-copilot"
version = "0.1.0"
description = "Auditable multi-agent supplier onboarding and third-party risk review"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40,<2",
    "langchain>=1.0,<2",
    "langgraph>=1.0,<2",
    "openai>=2.0,<3",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pyjwt[crypto]>=2.12,<3",
]

[project.optional-dependencies]
api = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "mangum>=0.19,<1",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.3,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]
worker = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "celery>=5.5,<6",
    "docling>=2.50,<3",
    "opensearch-py>=3.0,<4",
    "pgvector>=0.4,<1",
    "redis>=6.4,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
]
observability = [
    "langfuse>=3.0,<4",
    "opentelemetry-api>=1.36,<2",
    "opentelemetry-sdk>=1.36,<2",
]
dev = [
    "aiosqlite>=0.21,<1",
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "mangum>=0.19,<1",
    "pgvector>=0.4,<1",
    "mypy>=1.17,<2",
    "mcp>=2,<3",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "psycopg[binary]>=3.3,<4",
    "ruff>=0.12,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]
mcp = [
    "asyncpg>=0.30,<1",
    "mcp>=2,<3",
    "pgvector>=0.4,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
]
outbox = [
    "asyncpg>=0.30,<1",
    "pgvector>=0.4,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests crossing application boundaries",
    "eval: deterministic quality and safety regression tests",
]

[tool.alembic]
script_location = "%(here)s/apps/api/migrations"
prepend_sys_path = ["."]
